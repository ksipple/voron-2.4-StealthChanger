#OrcaSlicer
#M104 S0 ; Cancel slicer-injected heating so PRINT_START controls it
#M140 S0
#PRINT_START TOOL_TEMP={first_layer_temperature[initial_tool]} {if is_extruder_used[0]}T0_TEMP={first_layer_temperature[0]}{endif} {if is_extruder_used[1]}T1_TEMP={first_layer_temperature[1]}{endif} {if is_extruder_used[2]}T2_TEMP={first_layer_temperature[2]}{endif} {if is_extruder_used[3]}T3_TEMP={first_layer_temperature[3]}{endif} {if is_extruder_used[4]}T4_TEMP={first_layer_temperature[4]}{endif} {if is_extruder_used[5]}T5_TEMP={first_layer_temperature[5]}{endif} BED_TEMP=[first_layer_bed_temperature] TOOL=[initial_tool]

[gcode_macro PRINT_START]
gcode:
  {% set TOOL = params.TOOL | default(0)| int %}
  {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
  {% set BED_TEMP = params.BED_TEMP | default(0) | int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  {% if printer.tool_probe_endstop is defined %}
    M117 Disabling crash detection
    STOP_CRASH_DETECTION
  {% endif %}

  # Startup, lights on
  M117 Starting        
  #LIGHTS_ON

  # Cleanup
  CLEAR_PAUSE           # Reset pause state
  M107                  # Turns off part cooling fan
  BED_MESH_CLEAR        # Clears old saved bed mesh

  # Home the printer, set absolute positioning and update status LEDs
  M117 Homing         
  CG28                  # Conditional Full home (XYZ) - If not already homed
  G90                   # Absolute position
  M83                   # extruder relative mode

  M117 Heating Bed
  G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
  M190 S{BED_TEMP}

  T0 										# Ensure we have T0 active for pre print calibrations.

  # Nozzle cleaning
  #G4 P5000                                  # Waits 5 sec for ooze
  M117 Cleaning Nozzle
  KOMB 										# Clean Nozzle

  M117 Quad Gantry Level
  G28 Z                                     # Homes Z
  QUAD_GANTRY_LEVEL
  G28 Z                                     # Homes Z again after QGL

  # Bed mesh, park
  M117 Bed mesh  
  BED_MESH_CALIBRATE ADAPTIVE=1 			# Run adaptive bed mesh
  G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed

  # Switch to the initial printing tool and preheat it.
  {% if TOOL > 0 %}
    M104 T0 S0 ; Shutdown T0.
      T{params.TOOL} ; Switch to the initial printing tool
  {% endif %}

  M117 Waiting on T{params.TOOL} S{TOOL_TEMP}C
  M109 S{TOOL_TEMP} ; Wait for the tool to reach the target temperature

  # Clean nozzle hot
  M117 Cleaning Nozzle
  KOMB 										# Clean Nozzle 

  {% if printer.tool_probe_endstop is defined %}
    M117 Re-enabling crash detection
    START_CRASH_DETECTION
  {% endif %}

  # Prime nozzle
  M117 Priming Nozzle
  #VORON_PURGE                                       # KAMP voron prime logo - near object
  #LINE_PURGE                                        # KAMP prime line - near object
  PRIME_LINES										 #Prime all extruders before printing.
  SQUIGGLY_PURGE PURGE_LENGTH=50 PERIODS=5 LINE_MARGIN=15 ADAPTIVE_MODE=1  # Squiggly Purge line - near object

  # Print
  M117 Printing
  G90                                               # Absolute position  


[gcode_macro PRINT_END]
gcode:
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

  M220 S100 ; Set Feed rate to 100%
  M221 S100 ; Set Flow rate to 100%

  SET_PRESSURE_ADVANCE ADVANCE=0 ; Disable pressure advance

  G92 E0 ; zero the extruder
  G1 E-2.0 F3600 ; retract filament
  M400 ; wait for buffer to clear

  T0 ; Switch to tool 0

  G90 ; absolute positioning
  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000 ; move nozzle to remove stringing
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600 ; park nozzle at rear

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 ; reset gcode offset

  {% for tn in printer.toolchanger.tool_numbers %}
      M104 S0 T{tn} ; shutdown tool heater
      M107 T{tn} ; shutdown tool fan
      SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0 ; disable extruder stepper
  {% endfor %}

  M140 S0 ; shutdown bed heater

  # Clear states
  BED_MESH_CLEAR
  CLEAR_PAUSE


