[gcode_macro LOAD_FILAMENT]
variable_load_distance: 40         # Distance to load filament into the extruder
variable_purge_distance: 50        # Distance to purge filament after loading
variable_nozzle_preheat_temp: 250  # Default preheat temperature for the nozzle
variable_turn_off_extruder: True   # Option to turn off the extruder after loading (True/False)
gcode:
    # Parameters and settings
    {% set load_speed = params.LOAD_SPEED|default(600)|int %}
    {% set purge_speed = params.PURGE_SPEED|default(300)|int %}
    {% set target_temp = params.TARGET_TEMP|default(nozzle_preheat_temp)|int %}
    {% set min_temp = params.MIN_TEMP|default(180)|int %}
    {% set tool = params.TOOL|default("")|string|upper %}

    # Optional: pick up specified tool if passed (e.g. TOOL=2 or TOOL=T2)
    {% if tool != "" %}
        {% set t_cmd = tool if tool.startswith("T") else "T" ~ tool %}
        {t_cmd}
    {% endif %}

    # Detect active tool extruder
    {% set active_extruder = printer.toolhead.extruder %}
    {% if active_extruder == "" %}
        { action_raise_error("No active tool mounted! Pick up a tool first.") }
    {% endif %}

    # Enforce safe minimum temperature
    {% set final_temp = target_temp if target_temp >= min_temp else min_temp %}

    # Save current state of the printer
    SAVE_GCODE_STATE NAME=load_state

    # Heat active extruder to target temperature and wait
    SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={final_temp}
    TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={final_temp}

    # Begin filament loading process
    M83                                 # Set relative mode for extrusion only
    G92 E0                              # Reset extruder position
    G1 E{load_distance} F{load_speed}   # Load filament at the specified loading speed
    G1 E{purge_distance} F{purge_speed} # Purge filament at the slower purging speed

    # Optionally turn off the active extruder heater after loading
    {% if turn_off_extruder %}
        SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET=0
    {% endif %}

    # Restore previous state of the printer
    RESTORE_GCODE_STATE NAME=load_state

    # Completion message
    M117 Filament load complete on {active_extruder}


[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 100      # Distance to retract filament from the extruder
variable_nozzle_preheat_temp: 220  # Default preheat temperature for unloading
variable_turn_off_extruder: True   # Option to turn off the extruder after unloading (True/False)
gcode:
    # Parameters and settings
    {% set retract_speed = params.RETRACT_SPEED|default(600)|int %}
    {% set target_temp = params.TARGET_TEMP|default(nozzle_preheat_temp)|int %}
    {% set min_temp = params.MIN_TEMP|default(180)|int %}
    {% set tool = params.TOOL|default("")|string|upper %}

    # Optional: pick up specified tool if passed (e.g. TOOL=2 or TOOL=T2)
    {% if tool != "" %}
        {% set t_cmd = tool if tool.startswith("T") else "T" ~ tool %}
        {t_cmd}
    {% endif %}

    # Detect active tool extruder
    {% set active_extruder = printer.toolhead.extruder %}
    {% if active_extruder == "" %}
        { action_raise_error("No active tool mounted! Pick up a tool first.") }
    {% endif %}

    # Enforce safe minimum temperature
    {% set final_temp = target_temp if target_temp >= min_temp else min_temp %}

    # Save current state of the printer
    SAVE_GCODE_STATE NAME=unload_state

    # Heat the active nozzle only if current temperature is below target
    {% if printer[active_extruder].temperature < final_temp %}
        SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={final_temp}
        TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={final_temp}
    {% endif %}

    # Begin tip-shaping and filament unloading process
    M83                                       # Set relative mode for extrusion only
    G92 E0                                    # Reset extruder position

    # Tip shaping sequence to prevent stringing
    G1 E5 F300                                # Soften and purge tip slightly
    G1 E-15 F3000                             # Fast jerk out of melt zone
    G4 P2000                                  # Pause 2 seconds to let tip cool in heatbreak
    G1 E10 F1200                              # Dip back down briefly to form clean cone
    G1 E-15 F3000                             # Fast snap upward

    # Main retraction out of extruder
    G1 E-{unload_distance} F{retract_speed}   # Retract remaining filament at specified speed

    # Optionally turn off the active extruder heater after unloading
    {% if turn_off_extruder %}
        SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET=0
    {% endif %}

    # Restore previous state of the printer
    RESTORE_GCODE_STATE NAME=unload_state

    # Completion message
    M117 Filament unload complete on {active_extruder}



[gcode_macro PURGE]
variable_purge_distance: 15
gcode:
    {% set active_extruder = printer.toolhead.extruder %}
    {% if active_extruder == "" %}
        { action_raise_error("No active tool mounted! Pick up a tool first.") }
    {% endif %}

    {% if not printer[active_extruder].can_extrude %}
        { action_raise_error("Active tool (" ~ active_extruder ~ ") is below minimum extrude temp!") }
    {% endif %}

    {% set extruder_settings = printer.configfile.settings[active_extruder] %}
    {% set max_velocity = (extruder_settings.max_extrude_only_velocity|default(60)) * 60 %}
    {% set requested_speed = params.SPEED|default(300)|float %}
    {% set speed = [requested_speed, max_velocity]|min %}
    {% set distance = params.DISTANCE|default(purge_distance)|float %}

    SAVE_GCODE_STATE NAME=purge_state
    #LIGHTS_ON
    SET_DISPLAY_TEXT MSG="Purging filament on {active_extruder}..."
    M83                                 # Relative extrusion only
    G92 E0
    G1 E{distance} F{speed}             # Purge at clamped speed
    M400                                # Wait for current moves to finish
    SET_DISPLAY_TEXT MSG="Purge done."
    RESTORE_GCODE_STATE NAME=purge_state




    