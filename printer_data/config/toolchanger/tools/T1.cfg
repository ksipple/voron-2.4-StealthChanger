# if you want to use this file in your actual tool changer then remove the `example_` from the filename.

# This file contains common pin mappings for the BIGTREETECH EBBT1
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBT1]
canbus_uuid: 27493da3ba33
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -f ~/klipper/out/klipper.bin

[lis2dw]
cs_pin: EBBT1:PB1
spi_software_sclk_pin: EBBT1:PB10
spi_software_mosi_pin: EBBT1:PB11
spi_software_miso_pin: EBBT1:PB2
axes_map: x,z,y

[temperature_sensor T1_EBB36]
sensor_type: Generic 3950
sensor_pin: EBBT1:PA0
pullup_resistor: 2200

[extruder1]
step_pin: EBBT1:PB14
dir_pin: EBBT1:PA8
enable_pin: !EBBT1:PB6
heater_pin: EBBT1:PB4
sensor_pin: EBBT1:PA3
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
rotation_distance: 47.088
gear_ratio: 9:1
nozzle_diameter: 0.400
filament_diameter: 1.750
sensor_type: ATC Semitec 104NT-4-R025H42G
pullup_resistor: 2200
max_power: 1.0
min_extrude_temp: 170
control: pid
pid_Kp: 23.471
pid_Ki: 3.912
pid_Kd: 35.207
min_temp: 0
max_temp: 290
pressure_advance: 0.045
max_extrude_only_distance: 250
max_extrude_cross_section: 5
max_extrude_only_velocity: 75
max_extrude_only_accel: 1500
pressure_advance: 0.025
pressure_advance_smooth_time: 0.040

[tmc2209 extruder1]
uart_pin: EBBT1:PB3
interpolate: false
sense_resistor: 0.110
run_current: 0.6
stealthchop_threshold: 0

[heater_fan T1_hotend_fan]
pin: EBBT1:PD2
max_power: 1.0
kick_start_time: 0.5
heater: extruder1
heater_temp: 50.0
off_below: 0.1

[multi_pin T1_multipin]
pins: EBBT1:PD3, EBBT1:PA5

[fan_generic T1_partfan]
pin: multi_pin:T1_multipin
kick_start_time: 0.5
off_below: 0.10

# [filament_switch_sensor T1_fil_det]
# switch_pin: EBBT1:PD0

[output_pin T1_rled]
pin:EBBT1:PA2

#change the tool numbers to the tool you are configuring, ie T1, T1, etc
[tool T1]
#change this too
tool_number: 1
#if this were T1, then this would be extruder1, etc
extruder: extruder1
#Change T1_partfan to tool number
fan: T1_partfan
# Tool offset is 0.171875,-0.034375,-0.833750
gcode_x_offset: -0.001
gcode_y_offset: -0.379
gcode_z_offset: 0.0
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 83.19
params_park_y: 11.17
params_park_z: 303.9
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 52
params_input_shaper_damping_ratio_x: 0.098
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 37.2
params_input_shaper_damping_ratio_y: 0.088

[tool_probe T1]
pin: !EBBT1:PB8
tool: 1
speed: 8
samples: 3
samples_result: median
sample_retract_dist: 2
lift_speed: 5
samples_tolerance: 0.006
samples_tolerance_retries: 3
activate_gcode: _TAP_PROBE_ACTIVATE HEATER=extruder1
z_offset: 0

[neopixel T1]
pin: EBBT1:PC7
chain_count: 3
color_order: GRBW,GRBW,GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.6

[gcode_macro T1]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=1
