# if you want to use this file in your actual tool changer then remove the `example_` from the filename.


# This file contains common pin mappings for the BIGTREETECH EBBT0
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBT0] #EBB36 Gen2
canbus_uuid: 861e8339d779
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -f ~/klipper/out/klipper.bin

[lis2dw]
cs_pin: EBBT0:PB1
spi_software_sclk_pin: EBBT0:PB10
spi_software_mosi_pin: EBBT0:PB11
spi_software_miso_pin: EBBT0:PB2
axes_map: x,y,z

[temperature_sensor T0_EBB36]
sensor_type: Generic 3950
sensor_pin: EBBT0:PA0
pullup_resistor: 2200

[extruder]
step_pin: EBBT0:PB14
dir_pin: EBBT0:PA8
enable_pin: !EBBT0:PB6
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
rotation_distance: 4.71 ;4.7132
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBT0:PB4
sensor_type: ATC Semitec 104NT-4-R025H42G
pullup_resistor: 2200
sensor_pin: EBBT0:PA3
max_power: 1.0
min_extrude_temp: 170
control: pid
pid_Kp: 23.484
pid_Ki: 3.819
pid_Kd: 36.107
min_temp: 0
max_temp: 290
pressure_advance: 0.045
max_extrude_only_distance: 250
max_extrude_cross_section: 5
max_extrude_only_velocity: 75
max_extrude_only_accel: 1500
pressure_advance: 0.025
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: EBBT0:PB3
interpolate: false
sense_resistor: 0.110
run_current: 0.85
stealthchop_threshold: 0

[heater_fan T0_hotend_fan]
pin: EBBT0:PD3
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[multi_pin T0_multipin]
pins: EBBT0:PD2, EBBT0:PA5

[fan_generic T0_partfan]
pin: multi_pin:T0_multipin
kick_start_time: 0.5
off_below: 0.20

[filament_switch_sensor T0_fil_det]
switch_pin: EBBT0:PD0

[output_pin T0_rled]
pin:EBBT0:PA2

#change the tool numbers to the tool you are configuring, ie T0, T1, etc
[tool T0]
#change this too
tool_number: 0
#if this were T1, then this would be extruder1, etc
extruder: extruder
#Change T0_partfan to tool number
fan: T0_partfan
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 4.69
params_park_y: 9.29
params_park_z: 300.7
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 56.2
params_input_shaper_damping_ratio_x: 0.098
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 39.0
params_input_shaper_damping_ratio_y: 0.088


[tool_probe T0]
##  Tap Probe
pin: !EBBT0:PB8
tool: 0
speed: 8
samples: 3
samples_result: median
sample_retract_dist: 2
lift_speed: 5
samples_tolerance: 0.006
samples_tolerance_retries: 3
activate_gcode: _TAP_PROBE_ACTIVATE HEATER=extruder
z_offset = -0.870

[neopixel T0]
pin: EBBT0:PC7
chain_count: 3
color_order: GRBW,GRBW,GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.6

[gcode_macro T0]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=0