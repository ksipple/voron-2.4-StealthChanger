#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
##  Omron G3NB-210B-1
[heater_bed]
heater_pin: PA3
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
sensor_pin: PF3
##  Adjust max_power so it doesn't exceed the SSR rating. The Omron G3NA-210B-DC5 SSR is rated at 4 amps without a heatsink.
##  The formula is "4 / (Wattage_of_bed_heater / Mains_voltage) = max_power"
##  If max_power is greater than 1.0, use 1.0
max_power: 0.49
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769
pwm_cycle_time: 0.0166 # inserted to prevent causing lights to flicker for 60Hz power

[bed_mesh]
speed: 300
horizontal_move_z: 3          # Tap can use a lower lift height (3mm-5mm) to save time
mesh_min: 40, 40              # Safe margin from the edge of a 350mm bed
mesh_max: 310, 310            # Safe margin from the edge of a 350mm bed
probe_count: 7, 7             # 7x7 is highly recommended for a large 350mm bed
algorithm: bicubic
zero_reference_position: 175, 175  # Crucial for Tap: Absolute center of your 350mm bed
fade_start: 0.6
fade_end: 10.0
fade_target: 0


