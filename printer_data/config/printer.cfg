[include mainsail.cfg]
[include macros.cfg] #Misc. macros
[include start_end.cfg] #PRINT_START and PRINT_END
[include pause_resume_cancel.cfg]
[include load_unload.cfg]
[include park.cfg]
[include test.cfg]

[include KAMP_Settings.cfg] #https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
[include KOMB_Variables.cfg] #Brushing https://github.com/TmRxJD/KOMB
[include squiggly_purge.cfg] #https://github.com/mjonuschat/voron-mods/tree/main/Squiggly%20Purge
