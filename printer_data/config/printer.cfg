[exclude_object]

[gcode_arcs]                         # Enable arcs support (suggested for Orca Slicer)
resolution: 0.1

[virtual_pins]

[shaketune]

[axiscope]
pin: PG10              # Endstop pin
zswitch_x_pos: 125.5     # REQUIRED - X position of the endstop switch
zswitch_y_pos: 360     # REQUIRED - Y position of the endstop switch
zswitch_z_pos: 1       # REQUIRED - Z position + clearance of the endstop switch
lift_z: 5             # OPTIONAL - Z lift before XY moves (default: 1)
move_speed: 60         # OPTIONAL - XY move speed, mm/s (default: 60)
z_move_speed: 10     # OPTIONAL - Z move speed, mm/s (default: 10)

[mcu] #BTT Octopus Pro 1.0 STM32F446ZET6
canbus_uuid: a3756bed00b5

